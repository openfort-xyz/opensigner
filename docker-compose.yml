services:
  postgres:
    image: postgres:16
    container_name: ofpostgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - of_postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/create_database.sql
    networks:
      - backend_network
    expose:
      - "5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 4s
      retries: 10

  iframe:
    container_name: iframe
    volumes:
      - ./iframe/iframe_nginx.conf:/etc/nginx/conf.d/default.conf
    # Pinned by digest. This component reconstructs private keys in the
    # browser, so the exact build in use must be reproducible and explicit.
    image: ${IFRAME_IMAGE:-ghcr.io/openfort-xyz/iframe@sha256:e684a345e36108039e426498428163063f624088a98fa37cdb5366603d6a88f4}
    environment:
      PORT: ${IFRAME_CONTAINER_PORT:-5173}
    networks:
      - frontend_network
    expose:
      - "5173"
    ports:
      - "${IFRAME_HOST_PORT:-7050}:${IFRAME_CONTAINER_PORT:-5173}"
    depends_on:
      auth_service:
        condition: service_started
        restart: true
    restart: unless-stopped

  iframe-sample:
    container_name: iframe-sample
    build:
      context: ./iframe/sample
      dockerfile: Dockerfile
    image: openfort/iframe-sample:latest
    environment:
      PORT: ${IFRAME_SAMPLE_CONTAINER_PORT:-3000}
    networks:
      - frontend_network
    expose:
      - "3000"
    ports:
      - "${IFRAME_SAMPLE_HOST_PORT:-7051}:${IFRAME_SAMPLE_CONTAINER_PORT:-3000}"
    depends_on:
      auth_service:
        condition: service_started
        restart: true
      iframe:
        condition: service_started
        restart: true
    restart: unless-stopped

  auth_migrate:
    container_name: authmigrate
    build:
      context: ./auth_service
      dockerfile: Dockerfile
      target: migrate
    image: openfort/auth_migrate:latest
    environment:
      BETTER_AUTH_BASE_URL: ${BETTER_AUTH_BASE_URL:-http://localhost:7052}
      DB_NAME: ${AUTH_SERVICE_DB_NAME:-authservice}
      DB_USER: ${AUTH_SERVICE_DB_USER:-postgres}
      DB_PASS: ${AUTH_SERVICE_DB_PASS:?AUTH_SERVICE_DB_PASS must be set}
      DB_HOST: ${AUTH_SERVICE_DB_HOST:-ofpostgres}
      DB_PORT: ${AUTH_SERVICE_DB_PORT:-5432}
      DB_SSLMODE: ${AUTH_SERVICE_DB_SSLMODE:-require}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
    networks:
      - backend_network
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  auth_service:
    container_name: authservice
    build:
      context: ./auth_service
      dockerfile: Dockerfile
      target: runtime
    image: openfort/auth_service:latest
    environment:
      HOST: ${AUTH_SERVICE_CONTAINER_HOST:-0.0.0.0}
      PORT: ${AUTH_SERVICE_CONTAINER_PORT:-3000}
      BETTER_AUTH_BASE_URL: ${BETTER_AUTH_BASE_URL:-http://localhost:7052}
      DB_NAME: ${AUTH_SERVICE_DB_NAME:-authservice}
      DB_USER: ${AUTH_SERVICE_DB_USER:-postgres}
      DB_PASS: ${AUTH_SERVICE_DB_PASS:?AUTH_SERVICE_DB_PASS must be set}
      DB_HOST: ${AUTH_SERVICE_DB_HOST:-ofpostgres}
      DB_PORT: ${AUTH_SERVICE_DB_PORT:-5432}
      DB_SSLMODE: ${AUTH_SERVICE_DB_SSLMODE:-require}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:7050,http://localhost:7051}
      # Set to "true" only when exactly one reverse proxy sits in front of this
      # service; rate limiting then keys on the address that proxy saw instead
      # of the proxy itself.
      TRUST_PROXY: ${TRUST_PROXY:-false}
    networks:
      - frontend_network
      - backend_network
    expose:
      - "${AUTH_SERVICE_CONTAINER_PORT:-3000}"
    ports:
      - "${AUTH_SERVICE_HOST_PORT:-7052}:${AUTH_SERVICE_CONTAINER_PORT:-3000}"
    depends_on:
      postgres:
        condition: service_healthy
      auth_migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- \"http://localhost:$$PORT/health\" >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  cold_storage:
    container_name: coldstorage
    platform: linux/amd64
    image: ghcr.io/openfort-xyz/shield:v0.3.2
    command: server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Cold storage speaks the PostgreSQL wire protocol.
      DB_NAME: ${COLD_STORAGE_DB_NAME:-shield}
      DB_USER: ${COLD_STORAGE_DB_USER:-postgres}
      DB_PASS: ${COLD_STORAGE_DB_PASS:?COLD_STORAGE_DB_PASS must be set}
      DB_HOST: ${COLD_STORAGE_DB_HOST:-ofpostgres}
      DB_PORT: ${COLD_STORAGE_DB_PORT:-5432}
      # DB_SSL_MODE, not DB_SSLMODE: shield reads the underscored name and
      # defaults it to `disable`, so a near-miss here is not a misconfiguration
      # that surfaces -- it is an unencrypted connection that reports success.
      DB_SSL_MODE: ${COLD_STORAGE_DB_SSLMODE:-require}
    networks:
      - frontend_network
      - backend_network
    expose:
      - "${COLD_STORAGE_CONTAINER_PORT:-8080}"
    ports:
      - "${COLD_STORAGE_HOST_PORT:-7053}:${COLD_STORAGE_CONTAINER_PORT:-8080}"
    restart: unless-stopped

  hot_storage:
    container_name: hotstorage
    build:
      context: ./hot_storage
      dockerfile: Dockerfile
    image: openfort/hot_storage:latest
    environment:
      HOST: ${HOT_STORAGE_CONTAINER_HOST:-0.0.0.0}
      PORT: ${HOT_STORAGE_CONTAINER_PORT:-8080}
      AUTH_SERVER_URL: ${AUTH_SERVER_URL:-http://authservice:3000}
      # Expected JWT iss/aud. These are auth_service's EXTERNAL base URL, which
      # differs from AUTH_SERVER_URL (the internal address used to fetch JWKS),
      # so they cannot be derived from it.
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-${BETTER_AUTH_BASE_URL:-http://localhost:7052}}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-${BETTER_AUTH_BASE_URL:-http://localhost:7052}}
      # OAuth client ID accepted for x-auth-provider: google. Unset means the
      # provider is rejected rather than accepting any Google-signed token.
      GOOGLE_JWT_AUDIENCE: ${GOOGLE_JWT_AUDIENCE:-}
      # Permits fetching the JWKS over plaintext HTTP. Defaults to failing
      # closed; docker-compose.dev.yml overrides it for local runs.
      ALLOW_INSECURE_AUTH_SERVER: ${ALLOW_INSECURE_AUTH_SERVER:-false}
      DB_NAME: ${HOT_STORAGE_DB_NAME:-hotstorage}
      DB_USER: ${HOT_STORAGE_DB_USER:-postgres}
      DB_PASS: ${HOT_STORAGE_DB_PASS:?HOT_STORAGE_DB_PASS must be set}
      DB_HOST: ${HOT_STORAGE_DB_HOST:-ofpostgres}
      DB_PORT: ${HOT_STORAGE_DB_PORT:-5432}
      DB_SSLMODE: ${HOT_STORAGE_DB_SSLMODE:-require}
      SHARE_ENCRYPTION_KEY: ${SHARE_ENCRYPTION_KEY:?SHARE_ENCRYPTION_KEY must be set (64 hex chars)}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:7050,http://localhost:7051}
    networks:
      - frontend_network
      - backend_network
    expose:
      - "${HOT_STORAGE_CONTAINER_PORT:-8080}"
    ports:
      - "${HOT_STORAGE_HOST_PORT:-7054}:${HOT_STORAGE_CONTAINER_PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS \"http://localhost:$$PORT/health\" >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  docs:
    container_name: docs
    build:
      context: ./docs
      dockerfile: Dockerfile
      secrets:
        - node_auth_token
    image: openfort/keys-docs:latest
    networks:
      - frontend_network
    # 4173 is fixed in docs_nginx.conf; only the host port is configurable.
    expose:
      - "4173"
    ports:
      - "${DOCS_HOST_PORT:-7055}:4173"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- \"http://localhost:4173/health.json\" >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

networks:
  # Public-facing services and the APIs they call.
  frontend_network:
    driver: bridge
  # Databases live here with no route to the frontend services. `internal: true`
  # means no outbound gateway either, so a compromised database container cannot
  # reach the network.
  backend_network:
    driver: bridge
    internal: true

secrets:
  node_auth_token:
    environment: NODE_AUTH_TOKEN

volumes:
  of_postgres_data:
